<html>
<head>
<title>Hospital Appointment Form</title>
</head>
<body bgcolor="MintCream">
<center>
<h1><font color="DarkSlateBlue">HOSPITAL APPOINTMENT FORM</font></h1>
<hr width="80%">
<form>
<table border="2" cellpadding="10" cellspacing="0" width="85%" bgcolor="White">
<tr bgcolor="SteelBlue">
<th colspan="4">
<font color="White">PATIENT DETAILS</font>
</th>
</tr>
<tr>
<td>Patient Name</td>
<td><input type="text"></td>
<td>Age</td>
<td><input type="number"></td>
</tr>
<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
<td>Blood Group</td>
<td>
<select>
<option>A+</option>
<option>B+</option>
<option>O+</option>
<option>AB+</option>
</select>
</td>
</tr>
<tr>
<td>Phone Number</td>
<td><input type="tel"></td>
<td>Email</td>
<td><input type="email"></td>
</tr>
<tr bgcolor="LightSteelBlue">
<th colspan="4">
<font color="DarkBlue">APPOINTMENT DETAILS</font>
</th>
</tr>
<tr>
<td>Department</td>
<td>
<select>
<option>General Medicine</option>
<option>Cardiology</option>
<option>Orthopaedics</option>
<option>Dermatology</option>
</select>
</td>
<td>Doctor</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Appointment Date</td>
<td><input type="date"></td>
<td>Preferred Time</td>
<td><input type="time"></td>
</tr>
<tr>
<td>Symptoms</td>
<td colspan="3">
<textarea rows="4" cols="60"></textarea>
</td>
</tr>
<tr bgcolor="HoneyDew">
<th colspan="4">
<font color="DarkGreen">OTHER DETAILS</font>
</th>
</tr>
<tr>
<td>Medical Reports</td>
<td><input type="file"></td>
<td>Payment Mode</td>
<td>
<select>
<option>Cash</option>
<option>Card</option>
<option>UPI</option>
</select>
</td>
</tr>
<tr>
<td>Insurance</td>
<td colspan="3">
<input type="checkbox"> Available
<input type="checkbox"> Not Available
</td>
</tr>
<tr bgcolor="Gainsboro">
<td colspan="4" align="center">
<input type="submit" value="Book Appointment">
<input type="reset" value="Clear">
</td>
</tr>
</table>
</form>
</center>
</body>
</html>
